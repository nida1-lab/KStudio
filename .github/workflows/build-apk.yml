name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache bundled local toolchain
        uses: actions/cache@v4
        with:
          path: |
            app/build/generated/local-tools
            .local-toolchain-cache
          key: kstudio-local-v1-${{ hashFiles('tools/build_local_toolchain.py', 'tools/local/**') }}

      - name: Build APK
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest

      # APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KStudio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KStudio Run on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell svc wifi disable
            adb shell svc data disable
            python3 -c 'import subprocess; r=subprocess.check_output(["adb","shell","am","instrument","-w","com.nida.kstudio.test/com.nida.kstudio.RunDeviceChecks"],text=True); print(r); assert "KSTUDIO_OFFLINE_BUILD_OK" in r'
            adb exec-out run-as com.nida.kstudio cat files/device-test-counter.apk > offline-counter.apk
            adb exec-out run-as com.nida.kstudio cat files/device-test-console.apk > offline-console.apk
            python3 tools/smoke_run_android.py offline-counter.apk run-counter
            python3 tools/smoke_run_android.py offline-console.apk run-console
