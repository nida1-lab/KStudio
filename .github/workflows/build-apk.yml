name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Build
      - name: Test project snapshot and Gradle preparation
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Build APK
        run: gradle testDebugUnitTest assembleDebug

      # APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KStudio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  run-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        fixture: [run-counter, run-console]
    uses: ./.github/workflows/run-project.yml
    with:
      source_ref: ${{ github.sha }}
      request_id: smoke-${{ matrix.fixture }}-${{ github.run_id }}
      smoke_test: true
      fixture: ${{ matrix.fixture }}

